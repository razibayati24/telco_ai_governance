# =============================================================================
# Databricks App configuration template
# -----------------------------------------------------------------------------
# This file is a Jinja-style template. Run:
#     python render-app-yaml.py
# to read variables from your `.env` file and produce a workspace-specific
# `app.yaml` next to this template. The generated `app.yaml` is what
# `databricks apps deploy` actually reads.
#
# Why a template? Databricks Apps does NOT substitute env vars inside the
# `resources:` block at deploy time — `sql_warehouse.id` and
# `serving_endpoint.name` must be hard literal strings when the YAML is
# parsed by the apps service. The runtime `env:` block resource bindings
# (`valueFrom: <resource-key>`) work fine, but the resource definitions
# themselves need real values.
# =============================================================================

command: ['python', 'app.py']

# On-behalf-of scopes — the viewer's OAuth token will be forwarded to the
# app under X-Forwarded-Access-Token *only* if the matching scope is
# declared here.  These two are required for the Chat tab so the
# Multi-Agent Supervisor can run Genie queries as the viewer (per-user
# column masks resolve correctly).  Comment the entire block out to fall
# back to service-principal-only auth.
user_api_scopes:
  - serving.serving-endpoints
  - dashboards.genie

env:
  # --- Resource-bound (auto-injected from `resources:` below) ---
  - name: 'DATABRICKS_WAREHOUSE_ID'
    valueFrom: 'sql-warehouse'

  # --- Static workspace config ---
  - name: 'DATABRICKS_CATALOG'
    value: 'acme_catalog'
  - name: 'DATABRICKS_SCHEMA'
    value: 'ai_governance'
  - name: 'DATABRICKS_LLM_ENDPOINT'
    value: 'databricks-claude-sonnet-4-5'
  - name: 'DATABRICKS_VS_ENDPOINT'
    value: 'acme-vs-endpoint'
  - name: 'DATABRICKS_VS_INDEX'
    value: ''
  - name: 'DATABRICKS_EMBEDDING_MODEL'
    value: 'databricks-gte-large-en'
  - name: 'DATABRICKS_GENIE_SPACE_ID'
    value: ''
  - name: 'DATABRICKS_FINOPS_GENIE_SPACE_ID'
    value: ''
  - name: 'DATABRICKS_AI_OPS_GENIE_SPACE_ID'
    value: ''

  # --- Multi-Agent Supervisor (Agent Bricks) endpoint ---
  # Leave blank to make /api/agent/ask transparently fall back to the
  # Foundation-Model + Genie SQL pipeline (chat tab still works).  When
  # set, the value should match the `mas-endpoint` resource name below.
  - name: 'DATABRICKS_MAS_ENDPOINT'
    value: ''

  # --- Branding (consumed by /api/config + /api/ka + /api/genie) ---
  - name: 'BRAND_NAME'
    value: 'Acme Corp'
  - name: 'BRAND_PARENT'
    value: ''
  - name: 'BRAND_INDUSTRY'
    value: 'Generic'
  - name: 'EMAIL_DOMAIN'
    value: 'example.com'
  - name: 'APP_TITLE'
    value: 'AI Governance & Observability'
  - name: 'APP_SUBTITLE'
    value: 'AI Agentic FinOps Assistant'
  - name: 'SUPER_USER_GROUP_NAME'
    value: 'ai_gov_super_users'

  - name: 'NODE_ENV'
    value: 'production'

resources:
  - name: sql-warehouse
    sql_warehouse:
      id: '0123456789abcdef'
      permission: CAN_USE
  - name: serving-endpoint
    serving_endpoint:
      name: 'databricks-claude-sonnet-4-5'
      permission: CAN_QUERY

